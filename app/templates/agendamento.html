
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"defer></script>
    <title>Agendar consulta | Dr.Match</title>
    <link rel="stylesheet" href="{% static 'app/agendamento.css' %}">
    <script src="{% static 'app/agendamento.js' %}" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="Página inicial Dr.Match">
        <span class="brand-icon" aria-hidden="true">+</span>
        <span>Dr.Match</span>
        </a>
        <a href="/" class="back-link">Voltar ao início</a>
    </header>

    <main class="page">
        <section class="form-card">
            <div class="page-heading">
                <span class="eyebrow">SUA SAÚDE EM PRIMEIRO LUGAR</span>
                <h1>Pré-agendamento</h1>
                <p>Escolha o médico, a data e o horário desejados.</p>
            </div>

            <form id="formAgendamento">
                {% csrf_token %}

                <div class="field">
                    <label for="nome">Nome completo</label>
                    <input id="nome" name="nome" type="text"
                           maxlength="150" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email"
                           autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" name="telefone" type="tel"
                           maxlength="20" autocomplete="tel" required>
                </div>

                <div class="field">
                    <label for="medico">Médico</label>
                    <select id="medico" name="medico" required>
                        <option value="">Carregando médicos...</option>
                    </select>
                </div>
                //<!-- não muda nada, mas deixa ai: -->
                <div class="field">
                    <div id="calendario"></div>
                    <input id="data" name="data" type="hidden" required>
                </div>
                <div class="field">
                    <label for="horario">Escolha um horário</label>
                    <select id="horario" name="horario" required disabled>
                    <option value="">Selecione primeiro o médico e a data</option>
                    </select>
                </div>
                <button type="submit" id="botaoEnviar">
                    Solicitar pré-agendamento
                </button>

                <p id="mensagem" class="message" role="status"
                   aria-live="polite"></p>
            </form>

            <p class="notice">
                O pedido ficará pendente até que você entre em contato com
                o médico para confirmar a consulta.
            </p>
        </section>
    </main>
</body>
</html>
