
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Médicos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f4f9;
            margin: 0;
            padding: 30px 15px;
            color: #16294d;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000012;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .descricao {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #16294d;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #16294d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #mensagem {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Cadastro de Médicos</h1>
        <p class="descricao">
            Preencha os dados para realizar seu cadastro.
        </p>

        <form id="formCadastro">
            <label for="nome">Nome completo</label>
            <input id="nome" name="nome" maxlength="100" required>

            <label for="crm">CRM</label>
            <input id="crm" name="crm" maxlength="20" required>

            <label for="especialidade">Especialidade</label>
            <input id="especialidade" name="especialidade"
                   maxlength="100" required>

            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel"
                   maxlength="20" required>

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required>

            <label for="convenio">Convênio aceito</label>
            <input id="convenio" name="convenio" maxlength="100">

            <button type="submit" id="botaoCadastrar">
                Cadastrar médico
            </button>

            <p id="mensagem" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script>
        const formulario = document.getElementById("formCadastro");
        const mensagem = document.getElementById("mensagem");
        const botao = document.getElementById("botaoCadastrar");

        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const dados = Object.fromEntries(
                new FormData(formulario).entries()
            );

            mensagem.textContent = "";
            botao.disabled = true;

            try {
                const resposta = await fetch("/medicos/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify(dados)
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    const erros = resultado.errors || {};
                    const textos = Object.values(erros)
                        .flat()
                        .map(erro => typeof erro === "string"
                            ? erro
                            : erro.message);

                    mensagem.textContent = textos.length
                        ? textos.join(" ")
                        : "Não foi possível realizar o cadastro.";

                    mensagem.style.color = "#b91c1c";
                    return;
                }

                mensagem.textContent =
                    resultado.status || "Cadastro realizado com sucesso!";
                mensagem.style.color = "#15803d";
                formulario.reset();

            } catch (erro) {
                mensagem.textContent =
                    "Não foi possível conectar ao servidor.";
                mensagem.style.color = "#b91c1c";
            } finally {
                botao.disabled = false;
            }
        });
    </script>
</body>
</html>
